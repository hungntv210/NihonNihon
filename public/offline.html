<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mở khóa ngoại tuyến · Nihon Nihon</title><style>body{font-family:system-ui;max-width:30rem;margin:12vh auto;padding:24px;background:#f7f6f1;color:#253c30}input,button{font:inherit;padding:12px;display:block;margin:16px 0;width:100%;box-sizing:border-box}</style><h1>Mở khóa ngoại tuyến</h1><p>Nhập mật khẩu đã dùng khi bật tải ngoại tuyến trên thiết bị này. Chỉ các trang đã mở sau đó mới có bản sao.</p><form><label>Mật khẩu ngoại tuyến<input type="password" required autocomplete="current-password"></label><button>Mở trang đã lưu</button></form><p role="status"></p><script>document.querySelector('form').onsubmit=async e=>{e.preventDefault();const channel=new MessageChannel();channel.port1.onmessage=e=>{if(e.data.ok)location.reload();else document.querySelector('[role=status]').textContent='Mật khẩu không đúng hoặc chưa có bản tải. Kết nối mạng để mở ứng dụng.';};navigator.serviceWorker.controller?.postMessage({type:'UNLOCK',password:document.querySelector('input').value},[channel.port2]);};</script></html>
