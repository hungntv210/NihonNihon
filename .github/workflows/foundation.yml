name: G1 checks
on:
  pull_request:
  push:
    branches: [master]
jobs:
  foundation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Run every route browser check
        run: npm run test:browser
      - name: Upload browser check logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-check-logs
          path: data/reports/browser-suite/
          if-no-files-found: ignore
      - name: Check feature route ownership
        if: always() && startsWith(github.head_ref, 'g1/')
        env:
          FEATURE_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: node tools/check-route-scope.mjs "origin/$BASE_BRANCH" "$FEATURE_BRANCH"
